<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integrately Form Webhook Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 2rem;
      color: #1f2937;
      background: #f9fafb;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.25rem;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .note {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    form {
      display: grid;
      gap: 0.75rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Integrately Webhook Demo Form</h1>

    <p class="note">
      Replace <code>YOUR_INTEGRATELY_WEBHOOK_URL</code> in the script block below before testing.
      Open browser dev tools to view debug logs.
    </p>

    <form id="contact-form" action="#" method="post">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send</button>
    </form>
  </div>

  <script src="./glIntegratelyWebhook.js"></script>
  <script>
    glIntegratelyWebhookLogic(
      'contact-form',
      'YOUR_INTEGRATELY_WEBHOOK_URL',
      false, // Use true or 'verbose' only while troubleshooting.
      {
        injectTimestampField: 'submitted_at',
        injectPageSourceField: 'page_source_url',
        timestampFormat: 'human',
        timestampLocale: 'en-ZA',
        preferPlaceholderFieldNames: true
      }
    );
  </script>
</body>
</html>
